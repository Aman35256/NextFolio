apiVersion: v1
kind: ConfigMap
metadata:
  name: nextfolio-config
  namespace: default
data:
  ENV: "production"
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/nextfolio"
  REDIS_URL: "redis://redis-service:6379/0"
  CELERY_BROKER_URL: "redis://redis-service:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/2"
  QDRANT_HOST: "qdrant-service"
  QDRANT_PORT: "6333"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextfolio-fastapi
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nextfolio-fastapi
  template:
    metadata:
      labels:
        app: nextfolio-fastapi
    spec:
      containers:
      - name: fastapi
        image: nextfolio-fastapi:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: nextfolio-config
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "500m"
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: nextfolio-fastapi-service
  namespace: default
spec:
  selector:
    app: nextfolio-fastapi
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextfolio-celery
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextfolio-celery
  template:
    metadata:
      labels:
        app: nextfolio-celery
    spec:
      containers:
      - name: celery
        image: nextfolio-fastapi:latest
        imagePullPolicy: IfNotPresent
        command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: nextfolio-config
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
            nvidia.com/gpu: "1" # Requesting GPU acceleration for inference
          requests:
            cpu: "1"
            memory: 2Gi

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextfolio-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "nextfolio-fastapi-service"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nextfolio-fastapi-service
            port:
              number: 80
